version: '3.8'

x-common-env: &common-env
  FLASK_APP: wsgi.py
  FLASK_ENV: development
  BCRYPT_LOG_ROUNDS: 12
  SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-this-in-production}
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/main
  PROVISIONER_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/postgres
  REDIS_URL: redis://cache:6379/0
  FIRST_CYCLING_BASE_URL: ${FIRST_CYCLING_BASE_URL:-https://firstcycling.com}
  FIRST_CYCLING_API_PATH: ${FIRST_CYCLING_API_PATH}

x-common-depends: &common-depends
  database:
    condition: service_healthy
  # cache:
  #   condition: service_healthy

services:
  database:
    image: postgres:15-alpine
    container_name: database
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - database_vol:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pcm-manager-network

  # cache:
  #   image: redis:7-alpine
  #   container_name: cache
  #   ports:
  #     - "6379:6379"
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 3
  #   networks:
  #     - pcm-manager-network

  web:
    build:
      context: .
      dockerfile: docker/webapp/Dockerfile
    container_name: web
    environment:
      <<: *common-env
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CYCLING_API_KEY: ${CYCLING_API_KEY:-your-api-key-here}
      CYCLING_API_URL: ${CYCLING_API_URL:-https://api.example.com}
      # Admin user creation (optional)
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ./webapp:/app/webapp
      - ./migrations:/app/migrations
      - filestore_vol:/app/filestore
    ports:
      - "6000:6000"
    depends_on: *common-depends
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:6000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - pcm-manager-network

  # worker:
  #   build:
  #     context: .
  #     dockerfile: docker/webapp/Dockerfile
  #   container_name: worker
  #   command: celery -A app.extensions.celery worker --loglevel=info
  #   environment:
  #     <<: *common-env
  #   volumes:
  #     - ./webapp:/app/webapp
  #   depends_on: *common-depends
  #   networks:
  #     - pcm-manager-network

  reverse-proxy:
    image: nginx:alpine
    container_name: reverse_proxy
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./webapp/static:/app/webapp/static:ro
    depends_on:
      - web
    networks:
      - pcm-manager-network

volumes:
  database_vol:
  filestore_vol:

networks:
  pcm-manager-network:
    driver: bridge
