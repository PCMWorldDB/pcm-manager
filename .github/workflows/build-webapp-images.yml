name: Build Webapp Images

on:
  push:
    branches:
      - main
      - release/dev

jobs:
  build-prod:
    name: Build prod image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build webapp image (prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/webapp/Dockerfile
          push: true
          tags: ghcr.io/pcmworlddb/pcm-manager-webapp:prod

  build-dev:
    name: Build dev image
    if: github.ref == 'refs/heads/release/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build webapp image (dev)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/webapp/Dockerfile
          push: true
          tags: ghcr.io/pcmworlddb/pcm-manager-webapp:dev