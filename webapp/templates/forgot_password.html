{% extends "base.html" %}

{% block title %}Password Recovery{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Password Recovery</h4>
                </div>
                <div class="card-body">
                    {% if discord_reset_configured %}
                        <form method="GET" action="{{ url_for('web.discord_reset_start') }}">
                            <div class="mb-3">
                                <label for="reset-username" class="form-label">Username</label>
                                <input id="reset-username" name="username" class="form-control" required>
                            </div>
                            <button class="btn btn-primary" type="submit">Verify with Discord</button>
                        </form>
                    {% else %}
                        <p class="mb-0">Contact an administrator for a one-time password reset link.</p>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
