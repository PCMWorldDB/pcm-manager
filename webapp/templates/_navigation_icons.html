{% macro navigation_icon(name) -%}
<svg class="navigation-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    {% if name == 'release_manager' %}
    <path d="m12 3 9 5v8l-9 5-9-5V8z M3 8l9 5 9-5 M12 13v8 M7.5 5.5l9 5v4"></path>
    {% elif name == 'stat_editor' %}
    <path d="M3 3v18h18 M7 16v-4 M12 16V7 M17 16v-7"></path>
    {% elif name == 'team_manager' %}
    <circle cx="9" cy="8" r="3"></circle>
    <path d="M3 21v-3a6 6 0 0 1 12 0v3 M16 5a3 3 0 0 1 0 6 M21 21v-3a6 6 0 0 0-3-5.2"></path>
    {% elif name == 'wiki' %}
    <path d="M12 5v16 M3 3h5a4 4 0 0 1 4 2 4 4 0 0 1 4-2h5v16h-5a4 4 0 0 0-4 2 4 4 0 0 0-4-2H3z"></path>
    {% elif name == 'account' %}
    <circle cx="12" cy="7" r="4"></circle>
    <path d="M4 21v-2a8 8 0 0 1 16 0v2"></path>
    {% elif name == 'namespace' %}
    <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
    <path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5 M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"></path>
    {% elif name == 'lock' %}
    <rect x="5" y="10" width="14" height="11" rx="2"></rect>
    <path d="M8 10V7a4 4 0 0 1 8 0v3 M12 15v2"></path>
    {% else %}
    <circle cx="12" cy="12" r="4"></circle>
    <path d="M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2 M5 19l2-2 M17 7l2-2"></path>
    {% endif %}
</svg>
{%- endmacro %}
