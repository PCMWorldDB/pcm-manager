<div class="modal fade" id="add-pcs-race-modal" tabindex="-1" aria-labelledby="add-pcs-race-title" aria-hidden="true">
    <div class="modal-dialog"><div class="modal-content">
        <div class="modal-header">
            <h3 class="modal-title h5" id="add-pcs-race-title">Add PCS Race</h3>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <form id="add-pcs-race-form" method="post" action="{{ url_for('web.add_pcs_race') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label class="form-label" for="pcs-race-url">PCS race URL</label>
                <div class="d-flex gap-2">
                    <input class="form-control" id="pcs-race-url" name="pcs_url" type="url" placeholder="https://www.procyclingstats.com/race/…/{{ selected_year }}" required>
                    <button class="btn btn-primary" type="submit" id="get-pcs-race">Get</button>
                </div>
            </form>
            <div class="mt-3" id="pcs-race-progress" role="status" aria-live="polite" hidden>
                <span class="spinner-border spinner-border-sm me-2" id="pcs-race-spinner" aria-hidden="true" hidden></span>
                <span id="pcs-race-outcome" aria-hidden="true"></span>
                <span id="pcs-race-message"></span>
                <a id="pcs-race-result-link" class="ms-2" hidden>Open race</a>
            </div>
        </div>
    </div></div>
</div>
