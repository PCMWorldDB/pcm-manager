<div class="panel-card card mb-4">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-center gap-2 mb-3">
            <h3 class="h5 mb-0">List Attributes</h3>
            {% if can_start_list %}
            <a class="btn btn-outline-primary" href="{{ url_for('web.bulk_editor', tab='editor') }}">New list</a>
            {% endif %}
        </div>
        <div class="object-attributes bulk-list-attributes">
            <div class="object-attribute">
                <label for="list-name" class="object-attribute-label">List name</label>
                <div class="object-attribute-value">
                    {% if can_create_stats %}
                    <form method="post" action="{{ url_for('web.stats_editor_rename_list', list_id=stat_list.id) }}" class="attribute-edit-form w-100">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <input id="list-name" name="list_name" class="form-control form-control-sm" value="{{ stat_list.list_name }}" maxlength="120" required>
                        <button type="submit" class="btn btn-sm btn-outline-primary flex-shrink-0" aria-label="Save list name" title="Save list name">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12l4 4v12a2 2 0 0 1-2 2Z"/><path d="M7 3v6h10V3M7 21v-8h10v8"/></svg>
                        </button>
                    </form>
                    {% else %}
                    <input id="list-name" class="form-control form-control-sm" value="{{ stat_list.list_name }}" readonly>
                    {% endif %}
                </div>
            </div>
            <div class="object-attribute">
                <label for="list-type" class="object-attribute-label">Type</label>
                <div class="object-attribute-value">
                    <select id="list-type" class="form-select form-select-sm" disabled>
                        <option value="{{ stat_list.list_type }}" selected>{{ 'Attribute List' if is_attribute_list else 'Stat List' }}</option>
                    </select>
                </div>
            </div>
            <div class="object-attribute">
                <span class="object-attribute-label">Items</span>
                <div class="object-attribute-value">{{ list_item_rider_ids|length }}</div>
            </div>
            <div class="object-attribute">
                <span class="object-attribute-label">Approval status</span>
                <div class="object-attribute-value" aria-label="List status">
                    {% include '_bulk_list_status.html' %}
                </div>
            </div>
        </div>
    </div>
</div>
